<!DOCTYPE html>
<html lang="pt-PT">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <title>Blackjack25</title>
    <link rel="icon" type="image/png" href="img/png/icon_site.png">

    <!-- Bootstrap e Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS do Blackjack -->
    <link rel="stylesheet" href="css/blackjack_style.css">
  </head>

  <body>

    <!-- Cabeçalho -->
    <header class="site-header">
        <img src="img/png/logo.png" alt="Blackjack25" class="header-logo">
    </header>

    <main class="page-content">

      <!-- Mesa de Blackjack -->
      <section id="game" class="game-table">

        <!-- Fichas decorativas -->
        <div class="chip-rack">
          <span class="mini-chip chip-blue"></span>
          <span class="mini-chip chip-red"></span>
          <span class="mini-chip chip-green"></span>
          <span class="mini-chip chip-gold"></span>
          <span class="mini-chip chip-white"></span>
        </div>

        <!-- Implementação do JavaScript -->
        <div class="card-deck" aria-hidden="true"></div>

        <div class="dealer-area">
          <h2>Dealer</h2>
          <div id="dealer" class="cards-container"></div>
        </div>

        <div class="player-area">
          <h2>Player</h2>
          <!-- Implementação do JavaScript -->
          <div id="player" class="cards-container"></div>
        </div>

        <!-- Estado do jogo -->
        <!-- Implementação do JavaScript -->
        <div id="game_status" class="game-status"></div>

        <!-- Botões -->
        <div class="game-controls">

          <button class="btn btn-primary"id="card" type="button" onclick="playerNewCard()"> Card </button>

          <button class="btn btn-secondary" id="stand" type="button" onclick="dealerFinish()"> Stand </button>

          <button class="btn btn-success" id="new_game" type="button" onclick="newGame()" disabled> New Game</button>

        </div>

            <!-- Botão de ajuda -->
        <button class="btn btn-primary rounded-circle how-button" type="button">
          <i class="bi bi-question-lg"></i>
        </button>

      </section>

        <!-- Debug -->
        <section id="sec_debug" class="debug-panel">
            <h2>Debug</h2>
            <p id="debug"></p>
        </section>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <!-- JavaScript do Blackjack -->
    <script src="js/blackjack_object.js"></script>
    <script src="js/blackjack_manager.js"></script>

    <script>
      window.onload = newGame;
    </script>

  </body>
</html>
